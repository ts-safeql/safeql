packages:
  - "packages/*"
  - "packages/plugins/*"
  - "demos/*"
  - "docs"

allowBuilds:
  # Build/test tooling and the Prisma demo (pnpm prisma generate) need their scripts.
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # Optional native ws speed-ups: not required (pure-JS fallback) and need a
  # node-gyp toolchain to compile, so keep them disabled to avoid install breakage.
  bufferutil: false
  utf-8-validate: false

catalog:
  "@changesets/cli": "^3.0.3"
  "@eslint/js": "^10.0.1"
  "@types/node": "^24.12.0"
  "@typescript-eslint/eslint-plugin": "^8.72.0"
  "@typescript-eslint/parser": "^8.72.0"
  "@typescript-eslint/rule-tester": "^8.72.0"
  "@typescript-eslint/typescript-estree": "^8.72.0"
  "@typescript-eslint/utils": "^8.72.0"
  "eslint": "^10.13.0"
  "libpg-query": "^17.8.1"
  "postgres": "^3.4.9"
  "prettier": "^3.9.10"
  "publint": "^0.3.25"
  "tsx": "^4.23.15"
  "turbo": "^2.11.10"
  "typescript": "^6.0.3"
  "typescript-eslint": "^8.72.0"
  "unbuild": "^3.6.1"
  "vite": "^8.3.5"
  "vitest": "^5.0.5"

overrides:
  rollup-plugin-dts: "6.2.3"
